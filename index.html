<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoLeban</title>

  <link rel="icon" type="image/jpeg" href="./assets/logo.jpg" />
  <link rel="apple-touch-icon" href="./assets/logo.jpg" />

  <!-- External Library -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- Firebase SDK (compat). Only used when js/firebase-config.js is filled in. -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

  <!-- Datasets -->
  <script src="./lebanon.js"></script>
  <script src="./cazas.js"></script>
  <script src="./cities.js"></script>

  <!-- Application Scripts -->
  <script src="./js/constants.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script src="./js/backend.js" defer></script>
  <script src="./js/app.js" defer></script>
  <script src="./js/game.js" defer></script>
</head>

<body data-theme="light">

  <div class="control-card">
    <button class="btn-icon-square" id="btn-main-menu" title="Menu">
      <svg viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div class="pill-group" id="mode-switch">
      <button id="btn-gov" class="pill-btn active" onclick="setMode('gov')">المحافظات</button>
      <button id="btn-caza" class="pill-btn" onclick="setMode('caza')">الأقضية</button>
      <button id="btn-city" class="pill-btn" onclick="setMode('city')">المدن والقرى</button>
    </div>

    <div class="search-wrap">
      <input id="item-search" class="item-search" type="search" placeholder="بحث..." />
      <div class="item-suggestions" id="item-suggestions"></div>
    </div>

    <button class="btn-icon-square" id="item-search-btn" type="button" title="Search">
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
    </button>

    <select id="item-select" onchange="selectItem(this.value)">
      <option value="all">كامل لبنان</option>
    </select>

    <button class="btn-icon-square" id="btn-reset" onclick="resetView()" title="Recenter View">
      <svg viewBox="0 0 24 24">
        <path d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
      </svg>
    </button>
  </div>

  <div class="hud-panel">
    <div class="hud-block">
      <div class="compass-btn" title="Reset Heading" onclick="resetHeading()">
        <svg class="compass-ring" id="compass-needle" viewBox="0 0 44 44">
          <polygon points="22,6 26,22 18,22" fill="var(--hud-needle-n)" />
          <polygon points="22,38 26,22 18,22" fill="var(--hud-needle-s)" />
          <circle cx="22" cy="22" r="2.5" fill="var(--text)" />
        </svg>
      </div>
      <div class="hud-meta">
        <span class="hud-val" id="val-bearing">0°</span>
        <span class="hud-label" id="lbl-compass">بوصلة</span>
      </div>
    </div>

    <div class="hud-divider"></div>

    <div class="hud-block">
      <div class="pitch-track" title="Map Pitch">
        <div class="pitch-horizon" id="pitch-horizon"></div>
      </div>
      <div class="hud-meta">
        <span class="hud-val" id="val-pitch">0°</span>
        <span class="hud-label" id="lbl-tilt">الميل</span>
      </div>
    </div>

    <div class="hud-divider"></div>

    <div class="hud-block">
      <div class="hud-meta">
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span class="hud-val" id="val-alt">320 km</span>
          <span class="hud-sub" id="val-zoom">Z: 8.5</span>
        </div>
        <span class="hud-label" id="lbl-alt">الارتفاع</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <!-- ============================= BOOT OVERLAY ============================ -->
  <div class="overlay active" id="boot-overlay">
    <div class="boot-spinner">
      <img class="brand-logo boot-logo" src="./assets/logo.jpg" alt="GeoLeban" />
      <div class="boot-ring"></div>
    </div>
  </div>

  <!-- ============================= AUTH OVERLAY ============================ -->
  <div class="overlay" id="auth-overlay">
    <div class="panel auth-panel">
      <div class="brand brand-stacked">
        <img class="brand-logo brand-logo-lg" src="./assets/logo.jpg" alt="GeoLeban" />
        <p class="muted" data-i18n="subtitle"></p>
      </div>

      <div class="tab-switch">
        <button type="button" id="auth-tab-login" class="active" data-i18n="login"></button>
        <button type="button" id="auth-tab-signup" data-i18n="signup"></button>
      </div>

      <form id="auth-form" novalidate>
        <div class="field" id="auth-name-field">
          <label for="auth-name" data-i18n="fullName"></label>
          <input id="auth-name" type="text" autocomplete="name" />
        </div>
        <div class="field">
          <label for="auth-email" data-i18n="email"></label>
          <input id="auth-email" type="email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="auth-password" data-i18n="password"></label>
          <input id="auth-password" type="password" autocomplete="current-password" />
        </div>
        <p class="form-error" id="auth-error"></p>
        <button type="submit" class="btn-primary" id="auth-submit"></button>
      </form>

      <button type="button" class="link-btn" id="auth-switch"></button>
      <p class="local-note" id="auth-mode-note"></p>
    </div>
  </div>

  <!-- ============================= MENU OVERLAY ============================ -->
  <div class="overlay" id="menu-overlay">
    <div class="panel menu-panel">
      <div class="menu-head">
        <h2><span data-i18n="welcome"></span>, <span id="menu-user-name"></span></h2>
        <p class="muted" id="menu-user-email"></p>
      </div>
      <div class="menu-grid">
        <button class="menu-item primary" id="menu-play">
          <span class="menu-icon">▶</span><span data-i18n="menuPlay"></span>
        </button>
        <button class="menu-item" id="menu-stats">
          <span class="menu-icon">★</span><span data-i18n="menuStats"></span>
        </button>
        <button class="menu-item" id="menu-leaderboard">
          <span class="menu-icon">≡</span><span data-i18n="menuLeaderboard"></span>
        </button>
        <button class="menu-item" id="menu-explore">
          <span class="menu-icon">◎</span><span data-i18n="menuExplore"></span>
        </button>
        <button class="menu-item" id="menu-account">
          <span class="menu-icon">👤</span><span data-i18n="menuAccount"></span>
        </button>
      </div>

      <div class="menu-controls">
        <div class="pill-group" id="theme-switch">
          <button class="pill-btn active" id="btn-light" onclick="setTheme('light')">☀ Light</button>
          <button class="pill-btn" id="btn-dark" onclick="setTheme('dark')">☾ Dark</button>
        </div>

        <div class="pill-group" id="lang-switch">
          <button class="pill-btn active" id="lang-ar" onclick="setLanguage('ar')">
            <svg class="flag-icon" viewBox="0 0 600 400">
              <rect width="600" height="400" fill="#ED1C24" />
              <rect y="100" width="600" height="200" fill="#fff" />
              <polygon points="300,120 250,260 350,260" fill="#00A651" />
              <rect x="290" y="260" width="20" height="20" fill="#00A651" />
            </svg>
            AR
          </button>
          <button class="pill-btn" id="lang-en" onclick="setLanguage('en')">
            <svg class="flag-icon" viewBox="0 0 60 30">
              <clipPath id="s">
                <path d="M0,0 v30 h60 v-30 z" />
              </clipPath>
              <clipPath id="t">
                <path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z" />
              </clipPath>
              <g clip-path="url(#s)">
                <path d="M0,0 v30 h60 v-30 z" fill="#012169" />
                <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6" />
                <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t)" stroke="#C8102E" stroke-width="4" />
                <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10" />
                <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6" />
              </g>
            </svg>
            EN
          </button>
          <button class="pill-btn" id="lang-fr" onclick="setLanguage('fr')">
            <svg class="flag-icon" viewBox="0 0 3 2">
              <rect width="1" height="2" fill="#002395" />
              <rect x="1" width="1" height="2" fill="#fff" />
              <rect x="2" width="1" height="2" fill="#ED2939" />
            </svg>
            FR
          </button>
        </div>
      </div>

      <button class="link-btn" id="menu-logout" data-i18n="menuLogout"></button>
      <p class="local-note" id="menu-mode-note"></p>
    </div>
  </div>

  <!-- ============================= SETUP OVERLAY =========================== -->
  <div class="overlay" id="setup-overlay">
    <div class="panel setup-panel">
      <h2 data-i18n="title"></h2>

      <div class="setup-group">
        <label data-i18n="modeLabel"></label>
        <div class="segmented">
          <button data-setup-mode="gov" data-i18n="govOption"></button>
          <button data-setup-mode="caza" data-i18n="cazaOption"></button>
          <button data-setup-mode="city" data-i18n="cityOption"></button>
        </div>
      </div>

      <div class="setup-group" id="setup-area-group">
        <label data-i18n="areaLabel"></label>
        <div class="segmented">
          <button data-setup-area="famous" data-i18n="areaFamous"></button>
          <button data-setup-area="district" data-i18n="areaDistrict"></button>
          <button data-setup-area="pick" data-i18n="areaPick"></button>
        </div>
      </div>

      <div class="setup-group" id="setup-district-group">
        <label data-i18n="districtLabel"></label>
        <select id="setup-district"></select>
        <div class="custom-timer">
          <span data-i18n="countLabel"></span>
          <input id="setup-count" type="number" min="1" value="1" />
          <span id="setup-count-of"></span>
        </div>
      </div>

      <p class="setup-note" id="setup-custom-note" data-i18n="customNote"></p>

      <div class="setup-group">
        <label data-i18n="inputLabel"></label>
        <div class="segmented">
          <button data-setup-input="click" data-i18n="clickOption"></button>
          <button data-setup-input="type" data-i18n="typeOption"></button>
        </div>
      </div>

      <div class="setup-group">
        <label data-i18n="timerLabel"></label>
        <div class="segmented">
          <button data-setup-timer="0" data-i18n="noTimer"></button>
          <button data-setup-timer="1">1'</button>
          <button data-setup-timer="2">2'</button>
          <button data-setup-timer="5">5'</button>
        </div>
        <div class="custom-timer">
          <input id="setup-custom-min" type="number" min="1" max="60" placeholder="—" />
          <span data-i18n="customMinutes"></span>
        </div>
      </div>

      <div class="setup-actions">
        <button class="link-btn" id="setup-back" data-i18n="back"></button>
        <button class="btn-primary" id="setup-start" data-i18n="startGame"></button>
      </div>
    </div>
  </div>

  <!-- =============================== GAME HUD ============================== -->
  <div class="game-hud" id="game-hud">
    <div class="game-top">
      <span class="game-stat" id="game-progress"></span>
      <span class="game-stat timer" id="game-timer">0:00</span>
      <span class="game-stat" id="game-tries"></span>
      <span class="game-stat" id="game-accuracy"></span>
      <span class="game-stat" id="game-score"></span>
      <button class="game-sound" id="game-sound" data-i18n-title="soundOn">
        <svg viewBox="0 0 24 24">
          <path d="M11 5 6 9H3v6h3l5 4V5z" />
          <path class="sound-waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" />
        </svg>
      </button>
      <button class="game-restart" id="game-restart" data-i18n-title="restart">
        <svg viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" />
        </svg>
      </button>
      <button class="game-quit" id="game-quit" data-i18n="quit"></button>
    </div>

    <div class="game-prompt">
      <div class="game-prompt-label" id="game-prompt-label"></div>
      <div class="game-prompt-target" id="game-prompt-target"></div>
    </div>

    <div class="game-input-row" id="game-input-row">
      <input id="game-answer-input" type="text" autocomplete="off" data-i18n-ph="typePlaceholder" />
      <button id="game-answer-submit" data-i18n="submit"></button>
    </div>

    <div class="game-feedback" id="game-feedback"></div>
  </div>

  <div class="game-flash" id="game-flash"></div>

  <div class="game-cursor" id="game-cursor" aria-hidden="true">
    <span class="game-cursor-ring"></span>
    <span class="game-cursor-dot"></span>
  </div>

  <!-- ========================= MAP TOAST + SELECT BAR ====================== -->
  <div class="map-toast" id="map-toast"></div>

  <div class="select-bar" id="select-bar">
    <span class="select-instruction" data-i18n="pickInstruction"></span>
    <span class="select-count"><span data-i18n="selectedCount"></span>: <strong id="select-count">0</strong></span>
    <span class="select-error" id="select-error"></span>
    <button class="link-btn" id="select-clear" data-i18n="clearSelection"></button>
    <button class="game-quit" id="select-cancel" data-i18n="quit"></button>
    <button class="btn-primary" id="select-start" data-i18n="startGame"></button>
  </div>

  <!-- ============================ RESULTS OVERLAY ========================== -->
  <div class="overlay" id="results-overlay">
    <div class="panel results-panel">
      <h2 id="results-title"></h2>
      <div class="result-hero">
        <span id="results-accuracy">0%</span>
        <small data-i18n="accuracy"></small>
      </div>
      <div class="result-grid">
        <div><span id="results-solved"></span><small data-i18n="solved"></small></div>
        <div><span id="results-points"></span><small data-i18n="points"></small></div>
        <div><span id="results-time"></span><small data-i18n="time"></small></div>
      </div>
      <div class="best-box" id="results-best"></div>
      <p class="save-note" id="results-save"></p>
      <div class="result-actions">
        <button class="link-btn" id="results-menu" data-i18n="backToMenu"></button>
        <button class="link-btn" id="results-leaderboard" data-i18n="viewLeaderboard"></button>
        <button class="btn-primary" id="results-again" data-i18n="playAgain"></button>
      </div>
    </div>
  </div>

  <!-- ============================= STATS OVERLAY =========================== -->
  <div class="overlay" id="stats-overlay">
    <div class="panel wide-panel">
      <div class="panel-head">
        <h2 data-i18n="statsTitle"></h2>
        <button class="link-btn" id="stats-back" data-i18n="back"></button>
      </div>
      <p class="muted" data-i18n="statsSubtitle"></p>
      <div class="stats-grid" id="stats-grid"></div>
    </div>
  </div>

  <!-- ========================== LEADERBOARD OVERLAY ======================== -->
  <div class="overlay" id="leaderboard-overlay">
    <div class="panel wide-panel">
      <div class="panel-head">
        <h2 data-i18n="leaderboardTitle"></h2>
        <button class="link-btn" id="lb-back" data-i18n="back"></button>
      </div>
      <div class="lb-controls">
        <div class="tab-switch small">
          <button id="lb-tab-my" class="active" data-i18n="myTab"></button>
          <button id="lb-tab-custom" data-i18n="customTab"></button>
          <button id="lb-tab-global" data-i18n="globalTab"></button>
        </div>
        <label class="lb-filter-label" for="lb-filter" data-i18n="board"></label>
        <select id="lb-filter"></select>
      </div>
      <div class="table-wrap">
        <table class="lb-table">
          <thead>
            <tr>
              <th data-i18n="rank"></th>
              <th data-i18n="player"></th>
              <th data-i18n="accuracyCol"></th>
              <th data-i18n="timeCol"></th>
              <th data-i18n="pointsCol"></th>
            </tr>
          </thead>
          <tbody id="lb-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ============================ ACCOUNT OVERLAY ========================== -->
  <div class="overlay" id="account-overlay">
    <div class="panel">
      <div class="panel-head">
        <h2 data-i18n="accountTitle"></h2>
        <button class="link-btn" id="account-back" data-i18n="back"></button>
      </div>

      <form id="account-name-form" novalidate>
        <div class="field">
          <label for="account-name" data-i18n="fullName"></label>
          <input id="account-name" type="text" autocomplete="name" />
        </div>
        <p class="form-error" id="account-name-error"></p>
        <button type="submit" class="btn-primary" id="account-name-save" data-i18n="saveName"></button>
      </form>

      <div class="account-divider"></div>

      <form id="account-pass-form" novalidate>
        <div class="field">
          <label for="account-current-pass" data-i18n="currentPassword"></label>
          <input id="account-current-pass" type="password" autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="account-new-pass" data-i18n="newPassword"></label>
          <input id="account-new-pass" type="password" autocomplete="new-password" />
        </div>
        <p class="form-error" id="account-pass-error"></p>
        <button type="submit" class="btn-primary" id="account-pass-save" data-i18n="savePassword"></button>
      </form>
    </div>
  </div>

  <!-- =========================== CONFIRM MODAL ============================= -->
  <div class="overlay confirm-overlay" id="confirm-overlay">
    <div class="panel confirm-panel">
      <h3 id="confirm-title"></h3>
      <p class="confirm-message" id="confirm-message"></p>
      <div class="confirm-actions">
        <button class="link-btn" id="confirm-cancel"></button>
        <button class="btn-primary" id="confirm-ok"></button>
      </div>
    </div>
  </div>

</body>

</html>
